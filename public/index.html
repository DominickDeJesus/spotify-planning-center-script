<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>PLO Spotify Sync</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

		:root {
			--bg:        #0f1117;
			--surface:   #1a1d27;
			--border:    #2a2d3a;
			--green:     #1DB954;
			--green-dim: #17a348;
			--text:      #e8eaf0;
			--muted:     #6b7280;
			--error:     #ef4444;
			--warning:   #f59e0b;
			--radius:    10px;
			--mono:      'JetBrains Mono', monospace;
			--sans:      'Inter', sans-serif;
		}

		body {
			background: var(--bg);
			color: var(--text);
			font-family: var(--sans);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
		}

		.card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			width: 100%;
			max-width: 480px;
			overflow: hidden;
		}

		.card-header {
			padding: 28px 28px 20px;
			border-bottom: 1px solid var(--border);
			display: flex;
			align-items: center;
			gap: 14px;
		}

		.spotify-icon {
			width: 40px;
			height: 40px;
			flex-shrink: 0;
		}

		.card-header h1 {
			font-size: 17px;
			font-weight: 600;
			letter-spacing: -0.01em;
			line-height: 1.2;
		}

		.card-header p {
			font-size: 13px;
			color: var(--muted);
			margin-top: 2px;
		}

		.card-body {
			padding: 24px 28px;
			display: flex;
			flex-direction: column;
			gap: 20px;
		}

		/* Status rows */
		.status-grid {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.status-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			font-size: 13px;
		}

		.status-label {
			color: var(--muted);
		}

		.status-value {
			font-family: var(--mono);
			font-size: 12px;
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.dot {
			width: 7px;
			height: 7px;
			border-radius: 50%;
			flex-shrink: 0;
		}

		.dot-green  { background: var(--green); box-shadow: 0 0 6px var(--green); }
		.dot-red    { background: var(--error); }
		.dot-yellow { background: var(--warning); }

		/* Divider */
		.divider {
			height: 1px;
			background: var(--border);
		}

		/* Buttons */
		.btn {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			width: 100%;
			padding: 12px 20px;
			border-radius: 8px;
			font-family: var(--sans);
			font-size: 14px;
			font-weight: 500;
			cursor: pointer;
			border: none;
			transition: opacity 0.15s, transform 0.1s;
			text-decoration: none;
		}

		.btn:active { transform: scale(0.98); }
		.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

		.btn-primary {
			background: var(--green);
			color: #000;
		}

		.btn-primary:hover:not(:disabled) { background: var(--green-dim); }

		.btn-secondary {
			background: transparent;
			color: var(--text);
			border: 1px solid var(--border);
		}

		.btn-secondary:hover:not(:disabled) { background: var(--border); }

		/* Result banner */
		.result {
			display: none;
			padding: 12px 14px;
			border-radius: 8px;
			font-size: 13px;
			line-height: 1.4;
			font-family: var(--mono);
		}

		.result.success { background: rgba(29,185,84,0.12); color: var(--green); border: 1px solid rgba(29,185,84,0.25); }
		.result.error   { background: rgba(239,68,68,0.12);  color: var(--error); border: 1px solid rgba(239,68,68,0.25); }
		.result.show    { display: block; }

		/* Login view */
		#login-view { display: none; }
		#dashboard-view { display: none; }

		.login-note {
			font-size: 12px;
			color: var(--muted);
			text-align: center;
			line-height: 1.5;
		}

		.account-badge {
			background: var(--bg);
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 10px 14px;
			font-size: 13px;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.account-badge span { color: var(--muted); font-size: 12px; }
		.account-name { font-weight: 500; }

		/* Spinner */
		@keyframes spin { to { transform: rotate(360deg); } }
		.spinner {
			width: 14px;
			height: 14px;
			border: 2px solid rgba(0,0,0,0.3);
			border-top-color: #000;
			border-radius: 50%;
			animation: spin 0.6s linear infinite;
			display: none;
		}

		.btn-primary .spinner { border-color: rgba(0,0,0,0.3); border-top-color: #000; }
	</style>
</head>
<body>

<div class="card">
	<div class="card-header">
		<svg class="spotify-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
			<circle cx="20" cy="20" r="20" fill="#1DB954"/>
			<path d="M28.5 27.2c-.3.5-.9.6-1.4.3-3.8-2.3-8.6-2.8-14.2-1.5-.5.1-1.1-.2-1.2-.7-.1-.5.2-1.1.7-1.2 6.2-1.4 11.4-.8 15.7 1.8.5.3.6.9.4 1.3zm1.9-4.2c-.4.6-1.2.8-1.8.4-4.3-2.7-10.9-3.4-16-1.9-.7.2-1.4-.2-1.6-.9-.2-.7.2-1.4.9-1.6 5.8-1.8 13.1-1 18 2.2.6.4.8 1.2.5 1.8zm.2-4.4C26 15.8 17.9 15.5 13 16.9c-.8.2-1.6-.2-1.8-1-.2-.8.2-1.6 1-1.8 5.6-1.7 15-.1 20.4 3.5.7.4.9 1.4.5 2.1-.4.6-1.4.8-2.1.4l.6.9z" fill="white"/>
		</svg>
		<div>
			<h1>PLO Spotify Sync</h1>
			<p>Southwest Community Church</p>
		</div>
	</div>

	<!-- LOGIN VIEW -->
	<div class="card-body" id="login-view">
		<p class="login-note">Connect your Spotify account to start syncing this Sunday's worship songs to your playlist automatically.</p>
		<a href="/login" class="btn btn-primary">
			<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="8" fill="white" fill-opacity="0.2"/><path d="M11.4 10.9c-.1.2-.4.3-.6.1-1.5-.9-3.5-1.1-5.7-.6-.2 0-.4-.1-.5-.3 0-.2.1-.4.3-.5 2.5-.6 4.6-.3 6.3.7.2.1.3.4.2.6zm.8-1.7c-.2.3-.5.3-.7.2-1.7-1-4.4-1.4-6.4-.7-.3.1-.6-.1-.6-.4-.1-.3.1-.6.4-.6 2.3-.7 5.3-.4 7.2.9.2.1.3.4.1.6zm0-1.7C10 6.3 6.8 6.2 4.9 6.8c-.3.1-.6-.1-.7-.4-.1-.3.1-.6.4-.7 2.2-.7 6-.1 8.2 1.4.3.2.4.5.2.8-.2.3-.5.3-.8.3z" fill="white"/></svg>
			Log in with Spotify
		</a>
		<p class="login-note">You only need to do this once.</p>
	</div>

	<!-- DASHBOARD VIEW -->
	<div class="card-body" id="dashboard-view">
		<div class="account-badge">
			<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="8" fill="#1DB954"/><path d="M11.4 10.9c-.1.2-.4.3-.6.1-1.5-.9-3.5-1.1-5.7-.6-.2 0-.4-.1-.5-.3 0-.2.1-.4.3-.5 2.5-.6 4.6-.3 6.3.7.2.1.3.4.2.6zm.8-1.7c-.2.3-.5.3-.7.2-1.7-1-4.4-1.4-6.4-.7-.3.1-.6-.1-.6-.4-.1-.3.1-.6.4-.6 2.3-.7 5.3-.4 7.2.9.2.1.3.4.1.6zm0-1.7C10 6.3 6.8 6.2 4.9 6.8c-.3.1-.6-.1-.7-.4-.1-.3.1-.6.4-.7 2.2-.7 6-.1 8.2 1.4.3.2.4.5.2.8-.2.3-.5.3-.8.3z" fill="white"/></svg>
			<div>
				<div class="account-name" id="account-name">—</div>
				<span>Spotify account</span>
			</div>
		</div>

		<div class="status-grid">
			<div class="status-row">
				<span class="status-label">Authentication</span>
				<span class="status-value" id="status-auth">—</span>
			</div>
			<div class="status-row">
				<span class="status-label">Tokens saved</span>
				<span class="status-value" id="status-tokens">—</span>
			</div>
			<div class="status-row">
				<span class="status-label">Auto-sync</span>
				<span class="status-value" id="status-cron">—</span>
			</div>
		</div>

		<div class="divider"></div>

		<div id="sync-result" class="result"></div>

		<button class="btn btn-primary" id="sync-btn" onclick="syncNow()">
			<span class="spinner" id="sync-spinner"></span>
			<span id="sync-label">Sync playlist now</span>
		</button>

		<a href="/login" class="btn btn-secondary">Re-authenticate Spotify</a>
	</div>
</div>

<script>
	function getHashParams() {
		const params = {};
		const r = /([^&;=]+)=?([^&;]*)/g;
		let e;
		const q = window.location.hash.substring(1);
		while ((e = r.exec(q))) params[e[1]] = decodeURIComponent(e[2]);
		return params;
	}

	async function loadStatus() {
		try {
			const res = await fetch('/status');
			const data = await res.json();

			const setStatus = (id, ok, label) => {
				const el = document.getElementById(id);
				const color = ok ? 'dot-green' : 'dot-red';
				el.innerHTML = `<span class="dot ${color}"></span>${label}`;
			};

			setStatus('status-auth',   data.authenticated,  data.authenticated  ? 'connected'      : 'not connected');
			setStatus('status-tokens', data.tokensOnDisk,   data.tokensOnDisk   ? 'saved to disk'  : 'not saved');
			setStatus('status-cron',   data.cronScheduled,  data.cronScheduled  ? 'scheduled'      : 'not running');

			return data.authenticated;
		} catch (e) {
			return false;
		}
	}

	async function loadAccount(token) {
		if (!token) return;
		try {
			const res = await fetch('https://api.spotify.com/v1/me', {
				headers: { Authorization: 'Bearer ' + token }
			});
			const data = await res.json();
			document.getElementById('account-name').textContent = data.display_name || data.id || 'Unknown';
		} catch (e) {
			document.getElementById('account-name').textContent = 'Unknown';
		}
	}

	async function syncNow() {
		const btn = document.getElementById('sync-btn');
		const spinner = document.getElementById('sync-spinner');
		const label = document.getElementById('sync-label');
		const result = document.getElementById('sync-result');

		btn.disabled = true;
		spinner.style.display = 'block';
		label.textContent = 'Syncing…';
		result.className = 'result';
		result.textContent = '';

		try {
			const res = await fetch('/sync');
			const text = await res.text();
			result.className = 'result show ' + (res.ok ? 'success' : 'error');
			try {
				const json = JSON.parse(text);
				result.textContent = json.response || text;
			} catch {
				result.textContent = text;
			}
			// Refresh status after sync
			await loadStatus();
		} catch (e) {
			result.className = 'result show error';
			result.textContent = 'Network error — could not reach server.';
		} finally {
			btn.disabled = false;
			spinner.style.display = 'none';
			label.textContent = 'Sync playlist now';
		}
	}

	async function init() {
		const params = getHashParams();

		if (params.error === 'premium_required') {
			document.getElementById('login-view').style.display = 'flex';
			document.getElementById('login-view').style.flexDirection = 'column';
			const note = document.querySelector('#login-view .login-note');
			note.style.color = '#ef4444';
			note.textContent = 'A Spotify Premium account is required. Please log in with a Premium account.';
			return;
		}

		const authenticated = await loadStatus();

		if (authenticated) {
			document.getElementById('dashboard-view').style.display = 'flex';
			document.getElementById('dashboard-view').style.flexDirection = 'column';
			await loadAccount(params.access_token);
		} else {
			document.getElementById('login-view').style.display = 'flex';
			document.getElementById('login-view').style.flexDirection = 'column';
		}

		// Clear hash from URL without reload
		history.replaceState(null, '', window.location.pathname);
	}

	init();
</script>
</body>
</html>
